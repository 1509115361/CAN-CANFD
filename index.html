    .btn-success { background: #2ecc71; }
    .btn-success:hover { background: #27ae60; }

    th { background: #3498db; color: white; }
    tr:nth-child(even) { background: #f2f2f2; }

    .tab-content.active { display: block; }
    .tabs { display: flex; margin-bottom: 20px; }
    .tab-btn { padding: 10px 20px; background: #ecf0f1; border: none; cursor: pointer; border-radius: 5px 5px 0 0; }
    .tab-btn.active { background: #3498db; color: white; }

    .success { color: #2ecc71; }

<body>
  <div class="container">
    <h1>CAN/FD 信号命名规范工具</h1>
    <p>遵循《吉利新能源商用车 CAN/FD 信号命名规范 v1.1》</p>

    <div class="tabs">
      <button class="tab-btn active" data-tab="single">单条生成</button>
      <button class="tab-btn" data-tab="batch">批量转换</button>
      <button class="tab-btn" data-tab="excel">Excel校验</button>
      <button class="tab-btn" data-tab="dictionary">词库管理</button>
      <button class="tab-btn" data-tab="history">变更历史</button>
    </div>

    <!-- 单条生成 -->
    <div id="single" class="tab-content active">
      <div class="section">
        <label>输入信号名称（支持中文/英文）：</label>
        <input type="text" id="inputSignal" placeholder="例如：电池温度 或 Battery Temperature">
        <div style="margin: 15px 0;">
          <label>控制器名称缩写 (AAA)：</label>
          <input type="text" id="controller" placeholder="如：BMS、PMS、CHZC" value="BMS">
        </div>
        <div style="margin: 15px 0;">
          <label>信号类型 (Ccc) - 可选：</label>
          <select id="signalType">
            <option value="">无</option>
            <option value="Cmd">Cmd（指令控制）</option>
            <option value="Req">Req（指令请求）</option>
            <option value="Rsp">Rsp（指令响应）</option>
            <option value="Sts">Sts（状态）</option>
            <option value="Vld">Vld（有效性）</option>
            <option value="Err">Err（错误）</option>
            <option value="Custom">自定义...</option>
          </select>
          <input type="text" id="customType" class="hidden" placeholder="如：Mon" style="width: 100px; margin-left: 10px;">
        </div>
        <button onclick="generateSignal()">生成信号名</button>
        <button onclick="copyToClipboard()">复制结果</button>
        <div class="result" id="result"></div>
      </div>
    </div>

    <!-- 批量转换 -->
    <div id="batch" class="tab-content">
      <div class="section">
        <label>输入信号列表（每行一个，支持中英文）：</label>
        <textarea id="batchInput" rows="10" placeholder="电池温度
Battery Temperature
电机转速
Motor Speed"></textarea>
        <div style="margin: 15px 0;">
          <label>控制器名称缩写 (AAA)：</label>
          <input type="text" id="batchController" value="BMS">
        </div>
        <div style="margin: 15px 0;">
          <label>信号类型 (Ccc)：</label>
          <select id="batchType">
            <option value="">无</option>
            <option value="Cmd">Cmd</option>
            <option value="Req">Req</option>
            <option value="Rsp">Rsp</option>
            <option value="Sts">Sts</option>
            <option value="Vld">Vld</option>
            <option value="Err">Err</option>
            <option value="Custom">自定义</option>
          </select>
          <input type="text" id="batchCustomType" class="hidden" placeholder="如：Mon" style="width: 100px; margin-left: 10px;">
        </div>
        <button onclick="generateBatch()">批量生成</button>
        <button onclick="copyBatchResults()">复制全部</button>
        <div class="result" id="batchResult"></div>
      </div>
    </div>

    <!-- Excel校验 -->
    <div id="excel" class="tab-content">
      <div class="section">
        <label>上传Excel文件（两列：第一列英文名，第二列中文名）：</label>
        <input type="file" id="excelFile" class="file-input" accept=".xlsx, .xls">
        <button onclick="processExcel()">校验并修正</button>
        <div id="excelResult" class="result"></div>
      </div>
    </div>

    <!-- 词库管理 -->
    <div id="dictionary" class="tab-content">
      <div class="section">
        <h3>添加新词</h3>
        <label>中文名：</label>
        <input type="text" id="newChinese">
        <label>英文名：</label>
        <input type="text" id="newEnglish">
        <label>缩写：</label>
        <input type="text" id="newAbbreviation">
        <button onclick="addDictionaryEntry()">添加到词库</button>
        <div class="result" id="dictResult"></div>

        <h3>当前词库（前20条）</h3>
        <table id="dictTable">
          <thead>
            <tr><th>中文</th><th>英文</th><th>缩写</th></tr>
          </thead>
          <tbody id="dictBody"></tbody>
        </table>
      </div>
    </div>

    <!-- 变更历史 -->
    <div id="history" class="tab-content">
      <div class="section">
        <h3>词库变更历史</h3>
        <div class="log" id="historyLog"></div>
      </div>
    </div>
  </div>

    // 变更历史记录
    let historyLog = [];

    function addToHistory(action, original, result) {
      const entry = {
        time: new Date().toLocaleString(),
        action: action,
        original: original,
        result: result
      };
      historyLog.push(entry);
      updateHistoryDisplay();
    }

    function updateHistoryDisplay() {
      const logDiv = document.getElementById('historyLog');
      logDiv.innerHTML = historyLog.slice(-20).map(h => 
        `<div><strong>${h.time}</strong> - ${h.action}: <span class="error">${h.original}</span> → <span class="success">${h.result}</span></div>`
      ).join('');
    }

          "数据记录": "Data Log"
        };
        engText = chineseToEnglish[text] || text;
      }

      // 如果英文词已存在
      if (dictionary[engText]) {
        addToHistory("自动学习", text, dictionary[engText]);
        return dictionary[engText];
      }

      // 按规范处理：长度>10用元音剔除，否则全拼
      const words = engText.split(/\s+/);
      let abbr = '';

      if (words.length === 1) {
        if (engText.length <= 10) {
          abbr = engText;
        } else {
          abbr = removeVowels(engText);
          if (abbr.length > 8) abbr = abbr.substring(0, 8); // 限制长度
        }
      } else {
        // 多词：取每个单词首字母，或按长度处理
        abbr = words.map(w => {
          if (w.length <= 10) return w;
          else return removeVowels(w).substring(0, 4); // 截断
        }).join('');
      }

      // 限制总长度
      abbr = abbr.substring(0, 12);

      // 保存到词库
      dictionary[text] = abbr;
      dictionary[engText] = abbr;
      addToHistory("自动生成", engText, abbr);

      return abbr;
    }

    // 生成完整信号名：AAA_BbbBbb_Ccc
    function generateSignalName(controller, input, type) {
      // 清理输入
      input = input.trim();
      if (!input) return "错误：输入为空";

      // 生成BbbBbb部分
      let bbb = generateAbbreviation(input);

      // 处理Ccc
      let ccc = '';
      if (type && type !== 'Custom') {
        ccc = type;
      } else if (type === 'Custom') {
        ccc = document.getElementById('customType').value.trim();
        if (!ccc) return "错误：自定义类型不能为空";
      }

      // 组合
      let result = controller.trim() + '_' + bbb;
      if (ccc) result += '_' + ccc;

      return result;
    }

    // ==================== 按钮事件 ====================

    function generateSignal() {
      const input = document.getElementById('inputSignal').value;
      const controller = document.getElementById('controller').value;
      const type = document.getElementById('signalType').value;
      const customType = document.getElementById('customType').value;

      if (type === 'Custom') {
        document.getElementById('customType').classList.remove('hidden');
      } else {
        document.getElementById('customType').classList.add('hidden');
      }

      const result = generateSignalName(controller, input, type);
      document.getElementById('result').innerHTML = `<strong>生成结果：</strong><code>${result}</code>`;
    }

    function copyToClipboard() {
      const result = document.getElementById('result').innerText.replace('生成结果：', '').trim();
      navigator.clipboard.writeText(result).then(() => {
        alert('已复制到剪贴板');
      });
    }

    function generateBatch() {
      const inputs = document.getElementById('batchInput').value.split('\n').filter(line => line.trim());
      const controller = document.getElementById('batchController').value;
      const type = document.getElementById('batchType').value;
      const customType = document.getElementById('batchCustomType').value;

      if (type === 'Custom') {
        document.getElementById('batchCustomType').classList.remove('hidden');
      } else {
        document.getElementById('batchCustomType').classList.add('hidden');
      }

      let results = [];
      inputs.forEach(input => {
        const result = generateSignalName(controller, input, type);
        results.push(`${input} → ${result}`);
      });

      document.getElementById('batchResult').innerHTML = `<pre>${results.join('\n')}</pre>`;
    }

    function copyBatchResults() {
      const result = document.getElementById('batchResult').innerText;
      navigator.clipboard.writeText(result).then(() => {
        alert('已复制全部结果');
      });
    }

    // Excel处理
    function processExcel() {
      const fileInput = document.getElementById('excelFile');
      const file = fileInput.files[0];
      if (!file) {
        alert('请上传Excel文件');
        return;
      }

      // 使用 SheetJS 读取 Excel
      const reader = new FileReader();
      reader.onload = function(e) {
        const data = new Uint8Array(e.target.result);
        const workbook = XLSX.read(data, { type: 'array' });
        const firstSheetName = workbook.SheetNames[0];
        const worksheet = workbook.Sheets[firstSheetName];

        // 解析两列数据
        const jsonData = XLSX.utils.sheet_to_json(worksheet, { header: 1 });
        const results = [];

        for (let i = 0; i < jsonData.length; i++) {
          const row = jsonData[i];
          if (!row || row.length < 2) continue;

          const engName = row[0] || '';
          const chiName = row[1] || '';

          let corrected = '';
          let isValid = true;

          // 检查是否符合规范：是否包含下划线？是否为AAA_BbbBbb_Ccc格式？
          if (typeof engName === 'string' && engName.includes('_')) {
            const parts = engName.split('_');
            if (parts.length > 3) {
              isValid = false;
              corrected = "格式错误：超过3段";
            } else if (parts.length === 3) {
              // 有Ccc
              if (!['Cmd','Req','Rsp','Sts','Vld','Err'].includes(parts[2])) {
                isValid = false;
                corrected = "Ccc类型无效，建议使用：Cmd/Req/Rsp/Sts/Vld/Err";
              }
            }
            // 检查BbbBbb是否符合缩写规范
            const bbb = parts.length >= 2 ? parts[1] : '';
            if (bbb && bbb.length > 12) {
              isValid = false;
              corrected = "BbbBbb长度超过12字符";
            }
          }

          // 如果不符合，尝试生成正确格式
          if (!isValid || !engName.includes('_')) {
            let bbb = '';
            if (chiName && chiName !== '') {
              bbb = generateAbbreviation(chiName);
            } else if (engName && !engName.includes('_')) {
              bbb = generateAbbreviation(engName);
            }
            const controller = "BMS"; // 默认控制器
            const ccc = parts.length === 3 ? parts[2] : '';
            corrected = controller + '_' + bbb + (ccc ? '_' + ccc : '');
          }

          results.push({
            originalEng: engName,
            originalChi: chiName,
            corrected: corrected,
            isValid: isValid
          });
        }

        // 生成新Excel
        const newSheet = XLSX.utils.json_to_sheet(results.map(r => ({
          "信号英文名": r.originalEng,
          "信号中文名": r.originalChi,
          "修正后命名": r.corrected,
          "是否合规": r.isValid ? "是" : "否"
        })));

        const newWorkbook = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(newWorkbook, newSheet, "修正结果");
        XLSX.writeFile(newWorkbook, "CAN信号命名修正结果.xlsx");

        document.getElementById('excelResult').innerHTML = `<div class="success">✅ 已生成修正文件：CAN信号命名修正结果.xlsx</div>`;
      };
      reader.readAsArrayBuffer(file);
    }

    // 词库管理
    function addDictionaryEntry() {
      const chinese = document.getElementById('newChinese').value.trim();
      const english = document.getElementById('newEnglish').value.trim();
      const abbr = document.getElementById('newAbbreviation').value.trim();

      if (!chinese || !english || !abbr) {
        document.getElementById('dictResult').innerHTML = '<div class="error">所有字段必须填写</div>';
        return;
      }

      dictionary[chinese] = abbr;
      dictionary[english] = abbr;
      addToHistory("手动添加", `${chinese} / ${english}`, abbr);

      document.getElementById('dictResult').innerHTML = '<div class="success">✅ 已添加到词库</div>';
      document.getElementById('newChinese').value = '';
      document.getElementById('newEnglish').value = '';
      document.getElementById('newAbbreviation').value = '';

      updateDictionaryDisplay();
    }

    function updateDictionaryDisplay() {
      const tbody = document.getElementById('dictBody');
      tbody.innerHTML = '';
      const entries = Object.entries(dictionary).slice(0, 20);
      entries.forEach(([key, val]) => {
        const tr = document.createElement('tr');
        tr.innerHTML = `<td>${key}</td><td>${val}</td><td>${val}</td>`;
        tbody.appendChild(tr);
      });
    }

    // 初始化词库显示
    updateDictionaryDisplay();

    // 切换标签
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        const tabId = btn.getAttribute('data-tab');
        document.getElementById(tabId).classList.add('active');
        btn.classList.add('active');
      });
    });

    // 自定义类型输入框显示/隐藏
    document.getElementById('signalType').addEventListener('change', function() {
      document.getElementById('customType').classList.toggle('hidden', this.value !== 'Custom');
    });

    document.getElementById('batchType').addEventListener('change', function() {
      document.getElementById('batchCustomType').classList.toggle('hidden', this.value !== 'Custom');
    });

    // 初始化
    window.onload = function() {
      updateDictionaryDisplay();
      updateHistoryDisplay();
    };
  </script>
